name: Deploy Diamonds and Dimes to GitHub Pages

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Diamonds-and-Dimes/package-lock.json

      - name: Install dependencies
        working-directory: Diamonds-and-Dimes
        run: npm ci

      - name: Build application
        working-directory: Diamonds-and-Dimes
        run: npm run build

      - name: Add GitHub Pages route fallback
        working-directory: Diamonds-and-Dimes
        run: cp dist/index.html dist/404.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Diamonds-and-Dimes/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
